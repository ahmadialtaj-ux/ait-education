<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="640" height="340" rx="18" fill="#023e8a"/>
  <rect x="0" y="0" width="640" height="60" rx="18" fill="#90e0ef"/>
  <line x1="320" y1="70" x2="320" y2="330" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <g transform="translate(40,140)">
    <ellipse cx="120" cy="60" rx="115" ry="52" fill="#48cae4"/>
    <ellipse cx="120" cy="60" rx="88" ry="30" fill="#ffd166" stroke="#1d3557" stroke-width="3"/>
    <rect x="100" y="-5" width="40" height="30" rx="6" fill="#ffd166" stroke="#1d3557" stroke-width="3"/>
    <text x="120" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3557">crew</text>
    <text x="120" y="128" text-anchor="middle" font-size="15" fill="#ffffff">tanks FULL OF WATER</text>
  </g>
  <line x1="160" y1="290" x2="160" y2="325" stroke="#ff006e" stroke-width="7" marker-end="url(#ar2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">⬇ DIVE</text>
  <text x="160" y="124" text-anchor="middle" font-size="14" fill="#caf0f8">more mass → denser than seawater</text>
  <g transform="translate(360,90)">
    <ellipse cx="120" cy="60" rx="115" ry="52" fill="#ffffff" stroke="#caf0f8" stroke-width="3"/>
    <ellipse cx="120" cy="60" rx="88" ry="30" fill="#ffd166" stroke="#1d3557" stroke-width="3"/>
    <rect x="100" y="-5" width="40" height="30" rx="6" fill="#ffd166" stroke="#1d3557" stroke-width="3"/>
    <text x="120" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3557">crew</text>
    <circle cx="25" cy="60" r="6" fill="#caf0f8"/><circle cx="215" cy="55" r="6" fill="#caf0f8"/><circle cx="120" cy="105" r="6" fill="#caf0f8"/>
    <text x="120" y="140" text-anchor="middle" font-size="15" fill="#ffffff">tanks FULL OF AIR</text>
  </g>
  <line x1="480" y1="280" x2="480" y2="245" stroke="#06d6a0" stroke-width="7" marker-end="url(#ar2)"/>
  <text x="480" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">⬆ SURFACE</text>
  <text x="480" y="322" text-anchor="middle" font-size="14" fill="#caf0f8">less mass → less dense than seawater</text>
  <text x="320" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#023e8a">Ballast tanks around the inner hull</text>
</svg>
