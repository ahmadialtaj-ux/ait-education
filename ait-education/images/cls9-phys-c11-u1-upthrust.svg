<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="640" height="360" rx="18" fill="#eaf6ff"/>
  <rect x="0" y="150" width="640" height="210" fill="#48cae4" opacity="0.6"/>
  <line x1="0" y1="150" x2="640" y2="150" stroke="#0077b6" stroke-width="3"/>
  <line x1="320" y1="20" x2="320" y2="350" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- boat -->
  <path d="M90 130 L250 130 L225 175 L115 175 Z" fill="#e76f51" stroke="#1d3557" stroke-width="3"/>
  <rect x="160" y="95" width="30" height="35" fill="#f4a261" stroke="#1d3557" stroke-width="3"/>
  <line x1="195" y1="140" x2="195" y2="250" stroke="#e63946" stroke-width="8" marker-end="url(#ar)"/>
  <line x1="145" y1="175" x2="145" y2="65" stroke="#2a9d8f" stroke-width="8" marker-end="url(#ar)"/>
  <text x="40" y="80" font-size="17" font-weight="800" fill="#2a9d8f">upthrust</text>
  <text x="210" y="250" font-size="17" font-weight="800" fill="#e63946">weight</text>
  <text x="160" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1d3557">FLOATS: equal arrows</text>
  <!-- stone -->
  <ellipse cx="480" cy="215" rx="55" ry="38" fill="#6c757d" stroke="#1d3557" stroke-width="3"/>
  <line x1="480" y1="235" x2="480" y2="320" stroke="#e63946" stroke-width="8" marker-end="url(#ar)"/>
  <line x1="480" y1="195" x2="480" y2="158" stroke="#2a9d8f" stroke-width="8" marker-end="url(#ar)"/>
  <text x="495" y="168" font-size="17" font-weight="800" fill="#2a9d8f">upthrust</text>
  <text x="495" y="315" font-size="17" font-weight="800" fill="#e63946">weight</text>
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#1d3557">SINKS: weight wins</text>
  <!-- particles -->
  <g fill="#0077b6">
    <circle cx="110" cy="200" r="7"/><circle cx="140" cy="215" r="7"/><circle cx="205" cy="205" r="7"/><circle cx="235" cy="220" r="7"/>
    <circle cx="420" cy="290" r="7"/><circle cx="540" cy="295" r="7"/>
  </g>
  <g stroke="#0077b6" stroke-width="3" marker-end="url(#ar)">
    <line x1="110" y1="200" x2="122" y2="183"/><line x1="205" y1="205" x2="200" y2="185"/><line x1="140" y1="215" x2="145" y2="190"/>
  </g>
  <text x="160" y="320" text-anchor="middle" font-size="14" fill="#1d3557">water particles hit from below</text>
</svg>
